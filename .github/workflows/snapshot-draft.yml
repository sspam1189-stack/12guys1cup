# Snapshots any Sleeper draft (league or mock) into data/raw/drafts/<id>/ on
# the branch it ran from. Sleeper's API is unreachable from some analysis
# environments, so the runner does the fetching. Two ways in: dispatch it with
# a draft id (works once this file is on the default branch), or commit the id
# to data/raw/drafts/request — the push path exists because dispatch cannot
# see a workflow that only lives on a feature branch.
name: Snapshot draft
on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Sleeper draft id to snapshot
        required: true
  push:
    paths: ['data/raw/drafts/request']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch draft and picks
        env:
          INPUT_ID: ${{ inputs.draft_id }}
        run: |
          DRAFT_ID="${INPUT_ID:-$(tr -cd '0-9' < data/raw/drafts/request)}"
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]] || { echo "draft id must be numeric"; exit 1; }
          mkdir -p "data/raw/drafts/$DRAFT_ID"
          curl -fsS "https://api.sleeper.app/v1/draft/$DRAFT_ID" -o "data/raw/drafts/$DRAFT_ID/draft.json"
          curl -fsS "https://api.sleeper.app/v1/draft/$DRAFT_ID/picks" -o "data/raw/drafts/$DRAFT_ID/picks.json"
          echo "DRAFT_ID=$DRAFT_ID" >> "$GITHUB_ENV"
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/drafts
          git diff --cached --quiet || { git commit -m "data: snapshot draft $DRAFT_ID"; git push; }
