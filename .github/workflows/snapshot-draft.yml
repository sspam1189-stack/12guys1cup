# Snapshots any Sleeper draft (league or mock) into data/raw/drafts/<id>/ on
# the branch it is dispatched from. Sleeper's API is unreachable from some
# analysis environments, so the runner does the fetching.
name: Snapshot draft
on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Sleeper draft id to snapshot
        required: true
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch draft and picks
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]] || { echo "draft_id must be numeric"; exit 1; }
          mkdir -p "data/raw/drafts/$DRAFT_ID"
          curl -fsS "https://api.sleeper.app/v1/draft/$DRAFT_ID" -o "data/raw/drafts/$DRAFT_ID/draft.json"
          curl -fsS "https://api.sleeper.app/v1/draft/$DRAFT_ID/picks" -o "data/raw/drafts/$DRAFT_ID/picks.json"
      - name: Commit snapshot
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/drafts
          git diff --cached --quiet || { git commit -m "data: snapshot draft $DRAFT_ID"; git push; }
