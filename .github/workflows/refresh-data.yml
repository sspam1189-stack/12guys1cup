name: Refresh data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 2'   # Tuesdays 12:00 UTC; no-ops when nothing changed
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
      # Undocumented endpoint — never let an ADP shape change break the refresh.
      - run: npm run fetch:adp
        continue-on-error: true
      - run: npm run compute
      - run: npm test
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: weekly sleeper refresh"; git push; }
